; ESP32-S3-MINI-1 (UCSD EnVision ESP32-S3-mini DevBoard) driving the RC-N1C stick lines.
; The board's module has 4 MB of flash; esp32-s3-devkitm-1 defaults to 8 MB.
[env:esp32s3mini]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
board_upload.flash_size = 4MB
board_build.partitions = default.csv
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
monitor_speed = 115200
