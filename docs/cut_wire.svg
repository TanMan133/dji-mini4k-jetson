<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-label="One signal wire before and after the mod. Before: the stick module's AD pad is wired straight to the RC main board. After: the wire is cut, the stick-side end is covered in heat-shrink, and the ESP32 filter output is soldered onto the end still plugged into the main board."><style>
text{font-family:ui-monospace,Menlo,Consolas,monospace;fill:#1c2226}
.blk{font:600 15px ui-monospace,Menlo,monospace}.hdr{font:500 11px ui-monospace,monospace;letter-spacing:.08em;fill:#5d676d}
.pin{font:600 14px ui-monospace,monospace}.fn,.val,.note{font:400 11px ui-monospace,monospace;fill:#5d676d}.val{font-weight:500}
.rcl{font:500 12.5px ui-monospace,monospace}
.block{fill:#ffffff;stroke:#1c2226;stroke-width:1.5}.sig{fill:none;stroke:#b4561c;stroke-width:2;stroke-linejoin:round}
.plate{stroke:#b4561c;stroke-width:3}.gnd,.gndw{stroke:#5d676d;stroke-width:1.6;fill:none}.gndw{stroke-width:2.2}
.usb{stroke:#1c2226;stroke-width:2}.board{stroke:#1f6f8b;stroke-width:2.4}.dead{stroke:#5d676d;stroke-width:2;stroke-dasharray:2 4}
.ins{fill:#b3261e}.cut{stroke:#b3261e;stroke-width:2.4}.node{fill:#b4561c}.pad{fill:#ffffff;stroke:#1c2226;stroke-width:1.6}
</style><rect width="100%" height="100%" fill="#f6f7f4"/>
<text class="hdr" x="20" y="22">BEFORE</text>
<rect class="block" x="20" y="38" width="130" height="44" rx="5"/>
<text class="rcl" x="85" y="57" text-anchor="middle">stick module</text>
<text class="note" x="85" y="73" text-anchor="middle">sensor</text>
<circle class="pad" cx="150" cy="60" r="4"/>
<line class="board" x1="150" y1="60" x2="610" y2="60"/>
<text class="note" x="380" y="52" text-anchor="middle">AD signal wire in the harness</text>
<rect class="block" x="610" y="38" width="130" height="44" rx="5"/>
<text class="rcl" x="675" y="57" text-anchor="middle">RC main board</text>
<text class="note" x="675" y="73" text-anchor="middle">connector</text>

<text class="hdr" x="20" y="122">AFTER</text>
<rect class="block" x="20" y="138" width="130" height="44" rx="5"/>
<text class="rcl" x="85" y="157" text-anchor="middle">stick module</text>
<text class="note" x="85" y="173" text-anchor="middle">sensor</text>
<circle class="pad" cx="150" cy="160" r="4"/>
<line class="dead" x1="150" y1="160" x2="318" y2="160"/>
<text class="note" x="234" y="152" text-anchor="middle">now unused</text>
<rect class="ins" x="318" y="153" width="22" height="14" rx="3"/>
<text class="note" x="329" y="196" text-anchor="middle">heat-shrink</text>
<line class="cut" x1="368" y1="148" x2="360" y2="172"/>
<line class="cut" x1="398" y1="148" x2="390" y2="172"/>
<text class="note" x="379" y="140" text-anchor="middle">cut</text>
<line class="board" x1="398" y1="160" x2="610" y2="160"/>
<text class="note" x="560" y="152" text-anchor="middle">board end</text>
<circle class="node" cx="480" cy="160" r="4.2"/>
<line class="sig" x1="480" y1="160" x2="480" y2="226"/>
<text class="rcl" x="490" y="214">solder here</text>
<text class="note" x="490" y="230">wire from ESP32 filter (F1–F5)</text>
<rect class="block" x="610" y="138" width="130" height="44" rx="5"/>
<text class="rcl" x="675" y="157" text-anchor="middle">RC main board</text>
<text class="note" x="675" y="173" text-anchor="middle">connector</text>
</svg>
